<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：配合下面 apple meta，在 iPhone「添加到主屏幕」的 standalone 模式下
         页面直接铺到刘海/home 横条底下，不留白边；普通 Safari 不受影响
         interactive-widget=resizes-content：键盘弹出时直接压矮**布局视口**（Chrome 108+ 的默认值
         是 resizes-visual：布局视口不动、只压可视视口，于是页面能被浏览器往上推，
         推过去露出的是页面外的空白，收键盘后还不一定推回来）。iOS 不认识这个键，忽略即可 👇 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- iOS「添加到主屏幕」全屏三件套：
         capable   → 从图标打开时进入 standalone（无地址栏/工具栏，iPhone 没有网页全屏 API，这是唯一全屏途径）
         black-translucent → 状态栏透明覆盖在页面上，画面顶到屏幕最顶
         title/icon → 主屏图标的名字与图 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="咸鱼助手" />
    <link rel="apple-touch-icon" href="/1733492491706148.png" />
    <!-- Web App Manifest：iOS 16.4+ 对带 manifest 的主屏 web app 按一等公民处理。
         只有 apple meta 的旧式主屏 app，页内导航（点按钮跳路由）可能被 iOS 移交 Safari
         ⇒ 表现成「点任何功能都退出全屏」。manifest 的 display:standalone + scope 是正规解。
         ★ manifest 是「添加到主屏幕」那一刻读取的，改完必须删图标重加。 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>XYZW 游戏管理系统</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "SF Pro Display",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          "Hiragino Sans GB",
          "Microsoft YaHei",
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
      }

      #app {
        min-height: 100vh;
      }

      /* 一行细环 + 文案：环用 currentColor 留一道缺口，0.8s/圈。
         底色不动，仍是原来那支紫蓝渐变。 */
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 9px;
        height: 100vh;
        color: white;
        font-size: 18px;
      }

      .loading::before {
        content: "";
        width: 15px;
        height: 15px;
        border-radius: 50%;
        border: 2px solid currentColor;
        border-top-color: transparent;
        opacity: 0.6;
        animation: ld-spin 0.8s linear infinite;
      }

      @keyframes ld-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* 系统开了「减弱动态效果」就不转圈，只留静止的环 */
      @media (prefers-reduced-motion: reduce) {
        .loading::before {
          animation: none;
          opacity: 0.35;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="loading">正在加载应用...</div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <!-- 不要在这里引 /src/xyzw/*（cocos2d-js-min.js / game-defines.js / index.js）：
         Vite 会把它当入口打进 index.html 的同一个 chunk（产物里 4.7MB 里有 4.2MB 是它们），
         手机上「正在加载应用...」要等这 4.2MB 下完才消失；而这套引擎/游戏码只属于
         iframe 里的 public/game，本站源码从不引用 window.cc / window.__require，
         仅在 MultiPlayer.vue 的注释里被当成引擎行为的出处引用。 -->
  </body>
</html>
